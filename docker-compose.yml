services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dyanalyse-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL}
    restart: unless-stopped
    networks:
      - dyanalyse-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

networks:
  dyanalyse-network:
    driver: bridge
